name: Deploy

# Deploy to the FIIT server. Port 22 is closed from outside, so the job runs on
# the self-hosted runner on the server itself (scripts/runner-setup.sh) and
# SSHes to 127.0.0.1. The SSH key stored in GitHub can only run
# scripts/remote.sh (forced command in authorized_keys); passwords stay in
# `pass` on the server.
#
# Environment "staging":
#   secret DEPLOY_SSH_KEY       private SSH key
#   var    DEPLOY_HOST          127.0.0.1
#   var    DEPLOY_USER          user the network runs under
#   var    DEPLOY_KNOWN_HOSTS   "127.0.0.1 " + the server's /etc/ssh/ssh_host_ed25519_key.pub

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [deploy, restart, status]
        default: deploy
      sha:
        description: Commit from main to deploy (empty = this run). Rollback = an older commit.
        type: string
        required: false
      versions:
        description: Service versions, e.g. "NODE_VERSION=sha-abc1234 INDEXER_VERSION=sha-def5678" (empty = :main). Filled in by Jenkins after the nightly test.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.action }}
    runs-on: [self-hosted, staging]
    environment: staging
    timeout-minutes: 20
    steps:
      # The runner is not wiped between jobs, so the key lives only in
      # RUNNER_TEMP, which the runner empties before and after every job
      - name: SSH key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          (umask 077 && printf '%s\n' "$KEY" > "$RUNNER_TEMP/deploy_key")
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"

      - name: Run ${{ inputs.action }} on the server
        env:
          ACTION: ${{ inputs.action }}
          SHA: ${{ inputs.sha || github.sha }}
          VERSIONS: ${{ inputs.versions }}
          TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
        run: |
          cmd="$ACTION"
          if [[ "$ACTION" == deploy ]]; then
            [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full commit SHA"; exit 1; }
            # remote.sh validates the versions; here we only check allowed characters
            [[ "$VERSIONS" =~ ^[A-Za-z0-9_=\ -]*$ ]] || { echo "::error::Invalid versions"; exit 1; }
            cmd="deploy $SHA $VERSIONS"
          fi
          set -o pipefail
          out="$RUNNER_TEMP/out.txt"
          ssh -i "$RUNNER_TEMP/deploy_key" -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes "$TARGET" "$cmd" | tee "$out"
          {
            echo "### $ACTION"
            echo '```'
            cat "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
