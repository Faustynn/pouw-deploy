global:
  scrape_interval: 15s

# Every target is listed even when its service does not run (a profile is off or
# the service does not serve /metrics yet). Such a target is `down` on the
# Targets page, that is not an error of the configuration.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Network services (profile `network` until their images are in GHCR)
  - job_name: pouw-node
    static_configs:
      - targets: ["node-1:9100"]
  - job_name: pouw-indexer
    static_configs:
      - targets: ["indexer:8000"]
  - job_name: pouw-workload
    static_configs:
      - targets: ["workload:8001"]

  # The server and its containers (profile `host-metrics`)
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
