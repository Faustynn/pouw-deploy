apiVersion: 1

# The indexer database (ADR-0008), read through the read-only user `grafana`
# (monitoring/postgres/grafana-reader.sql). The password is the secret file.
datasources:
  - name: Indexer (Postgres)
    type: grafana-postgresql-datasource
    uid: indexer
    access: proxy
    url: postgres:5432
    user: grafana
    jsonData:
      database: pouw
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: $__file{/run/secrets/grafana_db_password}
